version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: recongraph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recongraph_secret}
      POSTGRES_DB: recongraph_prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recongraph"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-recongraph_redis_secret}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    environment:
      - DATABASE_URL=postgresql+asyncpg://recongraph:${POSTGRES_PASSWORD:-recongraph_secret}@postgres:5432/recongraph_prod
      - REDIS_URL=redis://:${REDIS_PASSWORD:-recongraph_redis_secret}@redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - ENVIRONMENT=production
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - RECONGRAPH_UPLOAD_DIR=/app/data/uploads
    volumes:
      - uploads_data:/app/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: python -m app.worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://recongraph:${POSTGRES_PASSWORD:-recongraph_secret}@postgres:5432/recongraph_prod
      - REDIS_URL=redis://:${REDIS_PASSWORD:-recongraph_redis_secret}@redis:6379/0
      - RECONGRAPH_UPLOAD_DIR=/app/data/uploads
      - ENVIRONMENT=production
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./recongraph-ui
      dockerfile: Dockerfile.ui
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  uploads_data:
