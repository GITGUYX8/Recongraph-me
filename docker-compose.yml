version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recongraph
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: 
      context: ./recongraph-api
      dockerfile: Dockerfile.api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./recongraph-api:/app
      - uploads_data:/app/data/uploads
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/recongraph
      - RECONGRAPH_UPLOAD_DIR=/app/data/uploads
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: 
      context: ./recongraph-api
      dockerfile: Dockerfile.api
    command: python -m app.worker
    volumes:
      - ./recongraph-api:/app
      - uploads_data:/app/data/uploads
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/recongraph
      - RECONGRAPH_UPLOAD_DIR=/app/data/uploads
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  ui:
    build:
      context: ./recongraph-ui
      dockerfile: Dockerfile.ui
    ports:
      - "3000:3000"
    volumes:
      - ./recongraph-ui:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  uploads_data:
