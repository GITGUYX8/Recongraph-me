[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recongraph"
version = "2.0.0"
description = "An explainable financial exception investigation and reconciliation engine."
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "rapidfuzz>=3.14,<4.0",
    "scikit-learn>=1.3.0",
    "anthropic>=0.3.0",
    "lightgbm>=4.0.0",
    "mlflow>=2.15.1",
    "qdrant-client>=1.10.1",
    "sentence-transformers>=3.0.1",
    "evidently",
    "tenacity",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.0",
    "hypothesis>=6.0",
]
benchmark = [
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0"
]
export = [
    "openpyxl>=3.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[project.scripts]
recongraph = "recongraph.cli:main"

[project.entry-points."recongraph.plugins.providers"]
financial = "recongraph.plugins.core_providers:FinancialEvidenceProvider"
temporal = "recongraph.plugins.core_providers:TemporalEvidenceProvider"
tax = "recongraph.plugins.core_providers:TaxEvidenceProvider"
vendor = "recongraph.plugins.core_providers:VendorEvidenceProvider"
reference = "recongraph.plugins.core_providers:ReferenceEvidenceProvider"
